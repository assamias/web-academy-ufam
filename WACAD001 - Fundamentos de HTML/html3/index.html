<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html3</title>
</head>
<body style="font-family: sans-serif; box-sizing: border-box; margin: 20px;">

    <!-- HEADER -->
    <header style="border: 2px solid black; padding: 20px; margin-bottom: 10px; text-align: center; background-color: #ff7b89;">
        <h1>&lt;header&gt;</h1>
    </header>
    
    <!-- NAV -->
    <nav style="border: 2px solid black; padding: 10px; margin-bottom: 10px; text-align: center; background-color: #3ee2a5;">
        <h3>&lt;nav&gt;</h3>
    </nav>
    
    
    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
        
        <!-- ASIDE -->
        <aside style="border: 2px solid black; padding: 20px; width: 30%; display: flex; align-items: center; justify-content: center; background-color: #fdbcc6;">
            <h2>&lt;aside&gt;</h2>
        </aside>

        <!-- MAIN -->
        <main style="border: 2px solid black; padding: 15px; width: 70%; text-align: center; background-color: #cbeaff;">
            <h3>&lt;main&gt;</h3>

            <!-- ARTICLE -->
            <article style="border: 2px solid black; padding: 15px; margin: 10px 0; background-color: #53d0ff;">
                <h4>&lt;article&gt;</h4>

                <!-- FIGURE -->
                <figure style="border: 2px solid black; padding: 20px; margin: 10px 0; background-color: #fff3a1;">
                    <h6>&lt;figure&gt;</h6>
                </figure>
                
                <!-- P -->
                <div style="border: 2px solid black; padding: 20px; margin: 10px 0; background-color: #e5ff99;">
                    <strong>&lt;p&gt;</strong>
                </div>
            </article>
            
            <!-- SECTION  -->
            <section style="border: 2px solid black; padding: 15px; margin-top: 10px; background-color: #00a2ff; color: black;">
                <h4>&lt;section&gt;</h4>
            </section>
        </main>

    </div>
    
    <!-- FOOTER -->
    <footer style="border: 2px solid black; padding: 20px; text-align: center; background-color: #b388ff;">
        <h3>&lt;footer&gt;</h3>
    </footer>

</body>
</html>
