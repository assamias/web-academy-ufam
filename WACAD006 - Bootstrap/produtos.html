<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja WA - Produtos</title>
  <!-- CSS do Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Menu Superior (Navbar) -->
  <!-- Comportamento responsivo de colapsar para telas menores que "md" -->
  <nav class="navbar navbar-expand-md navbar-light bg-light border-bottom">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Loja WA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacao" aria-controls="menuNavegacao" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuNavegacao">
        <ul class="navbar-nav me-auto mb-2 mb-md-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Gerenciar produtos</a>
          </li>
        </ul>
        <div class="d-flex">
          <a href="#" class="btn btn-secondary btn-sm">Sair</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Listagem de Produtos -->
  <div class="container my-5">
    
    <!-- Título alinhado à esquerda com espaçamento -->
    <h3 class="text-start mb-4">Produtos</h3>

    <!-- Grid Responsivo com espaçamento "3" (g-3) -->
    <!-- Telas < sm: 1 coluna (col-12) | Telas sm: 2 colunas (col-sm-6) | Telas >= md: 4 colunas (col-md-3) -->
    <div class="row g-3">
      
      <!-- Card 1 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 shadow-sm border-0">
          <img src="./assets/placeholder-image.png" class="card-img-top p-3" alt="Bicicleta">
          <div class="card-body bg-light rounded-bottom border-top">
            <h6 class="card-title fw-bold">Bicicleta</h6>
            <p class="card-text text-muted small">R$ 1000,00</p>
            <button class="btn btn-primary w-100 rounded-1">Adicionar ao carrinho</button>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 shadow-sm border-0">
          <img src="./assets/placeholder-image.png" class="card-img-top p-3" alt="Echo dot">
          <div class="card-body bg-light rounded-bottom border-top">
            <h6 class="card-title fw-bold">Echo dot</h6>
            <p class="card-text text-muted small">R$ 250,00</p>
            <button class="btn btn-primary w-100 rounded-1">Adicionar ao carrinho</button>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 shadow-sm border-0">
          <img src="./assets/placeholder-image.png" class="card-img-top p-3" alt="Celular">
          <div class="card-body bg-light rounded-bottom border-top">
            <h6 class="card-title fw-bold">Celular</h6>
            <p class="card-text text-muted small">R$ 1500,00</p>
            <button class="btn btn-primary w-100 rounded-1">Adicionar ao carrinho</button>
          </div>
        </div>
      </div>

      <!-- Card 4 (Botão Desabilitado) -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card h-100 shadow-sm border-0">
          <img src="./assets/placeholder-image.png" class="card-img-top p-3" alt="Umidificador">
          <div class="card-body bg-light rounded-bottom border-top">
            <h6 class="card-title fw-bold">Umidificador</h6>
            <p class="card-text text-muted small">R$ 150,00</p>
            <button class="btn btn-secondary w-100 rounded-1" disabled>Indisponível</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- JS do Bootstrap  -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
