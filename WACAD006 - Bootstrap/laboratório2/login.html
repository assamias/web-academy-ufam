<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja WA - Login</title>
  <!-- CSS do Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- login -->
  <div class="container-fluid vh-100">
    <div class="row h-100">
      <!-- Coluna da Esquerda (Menor) -->
      <div class="col-12 col-md-5 d-flex justify-content-center align-items-center bg-light">
        <h3 class="text-center">Bem vindo à WA Loja!</h3>
      </div>
      
      <!-- Coluna da Direita (Maior) -->
      <div class="col-12 col-md-7 d-flex justify-content-center align-items-center">
        <div class="w-100 px-3" style="max-width: 400px;">
          <form>
            <div class="mb-4">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control border-0 bg-light" id="email" required>
            </div>
            <div class="mb-4">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control border-0 bg-light" id="senha" required>
            </div>
            <button type="submit" class="btn btn-success w-100 mb-3">Entrar</button>
            <div class="text-center">
              <a href="cadastro.html" class="text-decoration-none">não tenho cadastro</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <!-- /login -->

  <!-- JS do Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
