<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html3</title>
</head>
<body>

    <header style="border: 2px solid black; padding: 20px; margin: 10px; text-align: center;">
        <h1>&lt;header&gt;</h1>
    </header>
    
    <nav style="border: 2px solid black; padding: 20px; margin: 10px; text-align: center;">
        <h3>&lt;nav&gt;</h3>
    </nav>
    
    
    <main style="border: 2px solid black; padding: 20px; margin: 10px; text-align: center;">
        <h3>&lt;main&gt;</h3>

        <article style="border: 2px solid black; padding: 15px; margin: 10px; margin-left: 270px; text-align: center;">
            <h4>&lt;article&gt;</h4>


            <figure style="border: 2px solid black; padding: 15px; margin: 15px 0; text-align: center; text-align: center;">
                <h6>&lt;figure&gt;</h6>

            </figure>
            
            <p style="border: 2px solid black; padding: 15px; margin: 15px 0; text-align: center;">
                <strong>&lt;p&gt;</strong><br>
            </p>
            
            <section style="border: 2px solid black; padding: 15px; margin: 15px 0; text-align: center;">
                <p><strong>&lt;section&gt;</strong></p>
            </section>
        </article>
        
        <div style="clear: both;"></div>
    </main>
    
    
    <footer style="border: 2px solid black; padding: 20px; margin: 10px; text-align: center;">
        <h3>&lt;footer&gt;</h3>
        
    </footer>
</body>
</html>
