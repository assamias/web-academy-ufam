<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compra</title>
  </head>  
    <body>
      <div id="resumo-carrinho">
        <h2>Fechamento do Pedido</h2>
        
        <!-- Valores que o JS precisa ler -->
        <label>Subtotal dos Produtos (R$):</label>
        <input type="number" id="valor-subtotal" value="150.00">
        <br><br>

        <label>Valor do Frete (R$):</label>
        <input type="number" id="valor-frete" value="25.50">
        <br><br>

        <!-- Lista para ser contada -->
        <h3>Itens na sua caixa:</h3>
        <ul id="lista-produtos">
          <li class="produto-comprado">Camiseta Básica Preta</li>
          <li class="produto-comprado">Calça Jeans Tradicional</li>
          <li class="produto-comprado">Par de Meias Brancas</li>
        </ul>
      </div>

      <script>
        // 1. Seleciona a quantidade de itens comprados
        const quantidadeItens = document.querySelectorAll('.produto-comprado').length;

        // 2. Captura os valores preenchidos nos inputs e converte para número
        const subtotal = parseFloat(document.getElementById('valor-subtotal').value);
        const frete = parseFloat(document.getElementById('valor-frete').value);

        // 3. Soma os valores para descobrir o total
        const total = subtotal + frete;

        // 4. Imprime as 4 informações no console seguindo o exemplo de saída
        console.log(`Quantidade de itens na caixa: ${quantidadeItens}`);
        console.log(`Subtotal: ${subtotal}`);
        console.log(`Frete: ${frete}`);
        console.log(`Total a pagar: ${total}`);
      </script>
    </body>
</html>
