<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja WA - Gerenciar Produtos</title>
  <!-- CSS do Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Menu Superior (Navbar) -->
  <nav class="navbar navbar-expand-md navbar-light bg-light border-bottom">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">Loja WA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacao" aria-controls="menuNavegacao" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuNavegacao">
        <ul class="navbar-nav me-auto mb-2 mb-md-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="produtos.html">Gerenciar produtos</a>
          </li>
        </ul>
        <div class="d-flex">
          <a href="login.html" class="btn btn-secondary btn-sm">Sair</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- gerenciar produtos -->
  <div class="container my-5">
    
    <!-- Título e Botão Novo Produto -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="m-0 text-start">Gerenciar Produtos:</h3>
      <button class="btn btn-warning fw-bold text-dark" data-bs-toggle="modal" data-bs-target="#modalNovoProduto">
        Novo Produto
      </button>
    </div>

    <!-- Tabela -->
    <div class="table-responsive">
      <table class="table table-striped align-middle text-center">
        <thead>
          <tr>
            <th class="text-start">id</th>
            <th class="text-start">Produto</th>
            <th class="text-start">Preço</th>
            <th>Estoque</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="text-start fw-bold">1</td>
            <td class="text-start">Bicicleta</td>
            <td class="text-start">R$ 1.000,00</td>
            <td>110</td>
            <td>
              <button class="btn btn-secondary btn-sm me-1">Editar</button>
              <button class="btn btn-secondary btn-sm">Excluir</button>
            </td>
          </tr>
          <tr>
            <td class="text-start fw-bold">2</td>
            <td class="text-start">Echo dot</td>
            <td class="text-start">R$ 600,00</td>
            <td>8</td>
            <td>
              <button class="btn btn-secondary btn-sm me-1">Editar</button>
              <button class="btn btn-secondary btn-sm">Excluir</button>
            </td>
          </tr>
          <tr>
            <td class="text-start fw-bold">3</td>
            <td class="text-start">Celular</td>
            <td class="text-start">R$ 1.500,00</td>
            <td>10</td>
            <td>
              <button class="btn btn-secondary btn-sm me-1">Editar</button>
              <button class="btn btn-secondary btn-sm">Excluir</button>
            </td>
          </tr>
          <tr>
            <td class="text-start fw-bold">4</td>
            <td class="text-start">Umidificador</td>
            <td class="text-start">R$ 100,00</td>
            <td class="text-danger fw-bold">0</td>
            <td>
              <button class="btn btn-secondary btn-sm me-1">Editar</button>
              <button class="btn btn-secondary btn-sm">Excluir</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Novo Produto -->
  <div class="modal fade" id="modalNovoProduto" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title" id="modalLabel">Novo produto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label for="produtoNome" class="form-label">Produto</label>
              <input type="text" class="form-control" id="produtoNome" required>
            </div>
            <div class="mb-3">
              <label for="produtoPreco" class="form-label">Preço</label>
              <input type="number" step="0.01" class="form-control" id="produtoPreco" required>
            </div>
            <div class="mb-4">
              <label for="produtoEstoque" class="form-label">Estoque</label>
              <input type="number" class="form-control" id="produtoEstoque" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Confirmar cadastro</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <!-- /gerenciar produtos -->

  <!-- JS do Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
